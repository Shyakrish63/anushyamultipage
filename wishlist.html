<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ShopNest - Wishlist</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="project.css">

</head>

<body>


<nav class="navbar navbar-dark main-nav">

    <div class="container">

        <a class="logo navbar-brand" href="index.html">
            <i class="bi bi-bag-heart-fill"></i>
            Shop<span>Nest</span>
        </a>

    </div>

</nav>


<section class="container section">

    <div class="page-title">

        <span>MY ACCOUNT</span>

        <h1>My Wishlist ❤️</h1>

        <p>Your saved products.</p>

    </div>


    <div class="wishlist-item">

        <img src="https://images.unsplash.com/photo-1598327105666-5b89351aff97?auto=format&fit=crop&w=400&q=80">

        <div>

            <h4>Premium Android Smartphone</h4>

            <div class="rating">★★★★★</div>

            <h3>₹24,999</h3>

            <a href="cart.html"
               class="btn add-button">

                Move to Cart

            </a>

            <button class="remove-button">
                Remove
            </button>

        </div>

    </div>


    <div class="wishlist-item">

        <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=400&q=80">

        <div>

            <h4>Wireless Headphones</h4>

            <div class="rating">★★★★☆</div>

            <h3>₹2,499</h3>

            <a href="cart.html"
               class="btn add-button">

                Move to Cart

            </a>

            <button class="remove-button">
                Remove
            </button>

        </div>

    </div>

</section>


<footer>

    <div class="container">

        <div class="footer-bottom">

            <p>© 2026 ShopNest</p>

            <a href="index.html">Home</a>

        </div>

    </div>

</footer>


</body>
</html>
